<style>
:root{--bg:#f3f3f1;--surface:#fff;--ink:#111;--muted:#555;--line:#d4d4d0;--accent:#111;--on-accent:#fff;--bad:#b3261e;--bad-bg:#fdeceb;--ok:#14683d;--ok-bg:#e6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
/* Eezy Kasi background: the whole kasi picture (kasi-bg.webp) under a soft light veil.
   Photo strength: change both .55 numbers (higher = fainter photo, lower = stronger). Keep them equal.
   On wide screens the picture shows whole with a blurred copy filling the sides; on tall phone screens it fills the screen. */

body::before{content:"";display:none;position:fixed;inset:-40px;z-index:-2;pointer-events:none;background:url("kasi-bg.webp") center/cover no-repeat;filter:blur(22px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(243,243,241,.55),rgba(243,243,241,.55)),url("kasi-bg.webp") 40% 50%/cover no-repeat;background-size:auto,cover}
@media (min-aspect-ratio:3/5){body::before{display:block}body::after{background-position:0 0,center top;background-size:auto,contain}}
h1,h2,h3,.brand,.zu,.muted,label,main>p,#app>p,.sub{text-shadow:0 0 6px rgba(243,243,241,.95),0 0 14px rgba(243,243,241,.85)}
/* Small grey lines under headings (for example "Tap one to start.") sit directly on the photo, so give them a stronger glow and darker text. */
.sub{color:#333;font-weight:600;text-shadow:0 0 3px #f3f3f1,0 0 6px #f3f3f1,0 0 10px rgba(243,243,241,.95),0 0 18px rgba(243,243,241,.9)}

  return `${SB_URL}/storage/v1/object/public/inanda-media/${path}`;
}
function grabFrame(src,local){
  return new Promise((resolve,reject)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload=local?"auto":"metadata";
    if(!local) v.crossOrigin="anonymous";
    const end=(fn,x)=>{ clearTimeout(t); v.removeAttribute("src"); try{v.load();}catch(e){} fn(x); };
    const t=setTimeout(()=>end(reject,new Error("timeout")),20000);
    v.addEventListener("error",()=>end(reject,new Error("cannot read video")));
    v.addEventListener("loadedmetadata",()=>{ v.currentTime=Math.max(.3,Math.min(1.5,(v.duration||3)*.1)); });
    v.addEventListener("seeked",()=>{
      try{
        const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
        c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>b?end(resolve,b):end(reject,new Error("no frame")),"image/jpeg",.8);
      }catch(e){ end(reject,e); }
    },{once:true});
    v.src=src;
  });
}

async function shrink(file,strict){
  // strict = driver pictures: they must end up as a normal JPG under 4.5 MB, or the person is told clearly what to do.
  const fail=()=>{ if(!strict) return file; throw new Error("This picture is in a format we cannot read"+(file.type?" ("+file.type.replace("image/","")+")":"")+". Please take it again with the normal camera setting (JPG), or choose another picture."); };
  let bmp=null;
  try{ bmp=await createImageBitmap(file); }catch(e){
    try{ bmp=await new Promise((ok,no)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>ok(im); im.onerror=()=>no(new Error("unreadable")); im.src=u; }); }catch(e2){ bmp=null; }
  }
  if(!bmp){ if(strict&&["image/jpeg","image/png","image/webp"].includes(file.type)&&file.size<4.5*1048576) return file; return fail(); }
  const w0=bmp.naturalWidth||bmp.width, h0=bmp.naturalHeight||bmp.height;
  for(const [mx,q] of [[1280,.8],[1000,.7],[720,.6]]){
    try{
      const k=Math.min(1,mx/Math.max(w0,h0)), c=document.createElement("canvas"); c.width=Math.round(w0*k); c.height=Math.round(h0*k);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
      if(blob&&(!strict||blob.size<4.5*1048576)) return blob;
    }catch(e){}
  }
  if(strict) throw new Error("This picture is too big. Please take it again or choose a smaller one.");
  return file;
}

  const path=sess.user.id+"/"+name;
  const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+sess.access_token,"x-upsert":"true","Content-Type":body.type||"image/jpeg"},body});
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){}
    throw new Error("Could not upload "+what.toLowerCase()+(m?": "+m:"")+" (code "+r.status+"). Check your data connection and try again."); }
  return path;
}

function getPos(){

      {enableHighAccuracy:true,timeout:15000,maximumAge:30000});

const kmBetween=(a,b)=>{ const r=x=>x*Math.PI/180, h=Math.pow(Math.sin(r(b.lat-a.lat)/2),2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.pow(Math.sin(r(b.lng-a.lng)/2),2); return 12742*Math.asin(Math.min(1,Math.sqrt(h))); };
async function fetchJson(url,ms){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms||9000);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); } finally{ clearTimeout(t); }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function nominatim(q){
  let j; try{ j=await fetchJson("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=za&viewbox=30.6,-29.4,31.4,-30.2&q="+encodeURIComponent(q)); }
  catch(e){ throw new Error("The place search did not answer. Check your internet and try again."); }
  return (j||[]).map(x=>({lat:+x.lat,lng:+x.lon,label:String(x.display_name||"").split(",").slice(0,3).join(",").trim()})).filter(x=>isFinite(x.lat)&&isFinite(x.lng));
}
// Street numbers in informal areas are often missing from the free map, so if the full address
// finds nothing we try shorter versions (without the postal code, house number and street).
function searchTries(q){
  const out=[], add=t=>{ t=t.replace(/\s{2,}/g," ").trim(); if(t.length>=3&&!/^\d+$/.test(t)&&!out.includes(t)) out.push(t); };
  add(q);
  const parts=q.split(",").map(x=>x.trim()).filter(x=>x&&!/^\d{4}$/.test(x));
  if(parts.length>1){
    add(parts.join(", "));
    const noNum=parts[0].replace(/^\d+\s+/,""); add([noNum].concat(parts.slice(1)).join(", "));
    for(let i=1;i<parts.length;i++) add(parts.slice(i).join(", "));
  } else if(parts.length===1){
    const w=parts[0].split(/\s+/); for(let i=1;i<w.length;i++) add(w.slice(i).join(" "));
  }
  return out.slice(0,5);
}
async function findPlaces(q){
  const tries=searchTries(q);
  for(let k=0;k<tries.length;k++){
    if(k>0) await sleep(1100);                                   // the free map service allows about one search per second
    const res=await nominatim(tries[k]);
    if(res.length){ res.approx=k>0; return res; }
  }
  return Object.assign([],{approx:false});
}

  try{ const j=await fetchJson(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`,9000);
    if(j&&j.code==="Ok"&&j.routes&&j.routes[0]) return {km:j.routes[0].distance/1000,est:false}; }catch(e){}

}

  return `<h1>Request a car ride</h1><p class="sub">Choose where from and where to. The app works out the distance and shows one fixed price before you ask for a driver. You pay the driver in cash.</p>${msgs()}
  <div class="card">${pointBox("pickup","Pick-up")}${pointBox("drop","Drop-off")}</div>
  ${q?`<div class="card"><div class="row"><span>Distance</span><b>${esc(q.km)} km</b></div><div class="row"><span>Fixed price</span><b class="big">${R(q.price_cents)}</b></div>${q.surcharge_cents>0?`<div class="row"><span>Includes weekend rate (Fri 15:30 to Sun 17:00)</span><b>${R(q.surcharge_cents)}</b></div>`:""}<div class="note">${d.est?"The map service did not answer, so the distance is an estimate. The price shown is still the price you pay. ":""}You pay the driver in cash when you arrive.</div></div>`:""}
  <div class="card">${landmarkBlock()}${favPick()}<div class="note">The driver will text or send you a voice note. Cell numbers are never shared.</div>${fld("rdnote","Anything the driver should know (optional)","e.g. blue gate, red jacket")}
  <button class="btn" data-a="rdsend" ${q?"":"disabled"}>Request this ride</button><button class="btn ghost" data-a="rdback">Back</button></div>`;
}
function driveTab(){
  if(ST.rd) return rideForm();
  if(ST.req) return reqForm();
  const trips=ST.trips.map(t=>{
    const g=tagFor(t.status), offs=ST.offers.filter(o=>o.request_id===t.id), chosen=offs.find(o=>o.status==="chosen"); let body="";
    if(t.status==="open"&&t.ride_type==="car") body='<div class="note">Waiting for a car driver to accept. Your fixed price is <b>'+R(t.price_cents)+'</b> ('+esc(t.distance_km)+' km). You will hear a sound when a driver accepts.</div>';
    else if(t.status==="open") body=offs.length?offs.map(o=>{const ok=t.budget_cents&&o.price_cents<=t.budget_cents;
      return `<div class="note">${person(o.drivers||{})}<div class="row"><b>${R(o.price_cents)}</b>${ok?'<span class="tag ok">Within your budget</span>':""}</div><button class="sm" data-a="chatwith" data-v="${o.driver_id}">Message driver</button><button class="btn" data-a="choose" data-id="${t.id}" data-v="${o.driver_id}">Choose this driver</button></div>`}).join(""):'<div class="note">No driver has accepted yet. Tap Refresh in a little while.</div>';
    else if(chosen) body=`<div class="note">${person(chosen.drivers||{})}<div class="row"><span>Pay the driver in cash</span><b>${R(t.price_cents)}</b></div><p style="margin:6px 0"><small>The driver will text or send you a voice note in Messages.</small></p><button class="sm" data-a="chatwith" data-v="${chosen.driver_id}">Message driver</button>${t.ride_type!=="car"&&(t.status==="accepted"||t.status==="started")?` <button class="sm" data-a="callback" data-k="driver" data-v="${chosen.driver_id}" data-n="${esc((chosen.drivers||{}).full_name||"your driver")}">📞 Call me back</button>`:""}</div>`;
    if(t.status==="accepted"&&t.ride_type==="car"&&ST.pins&&ST.pins[t.id]) body+=`<div class="card" style="text-align:center;border:2px solid var(--brand,#0a7)"><small>Your trip PIN</small><div style="font-size:40px;font-weight:800;letter-spacing:10px;margin:4px 0">${esc(ST.pins[t.id])}</div><small>Check the car and the driver's photo, then give the driver this PIN when you get in. The trip cannot start without it. Never send it by message.</small></div>`;
    if(t.status==="completed"&&t.ride_type==="car"&&chosen&&!(ST.favs||[]).some(d=>d.id===chosen.driver_id)) body+=`<button class="btn ghost" data-a="favon" data-v="${esc(chosen.driver_id)}">Save ${esc((chosen.drivers||{}).full_name||"this driver")} as my regular driver</button>`;
    const act=(t.status==="accepted"||t.status==="started")?`<button class="btn" data-a="arrived" data-id="${t.id}">I have arrived safely</button>`:"";
    const can=(t.status==="open"||t.status==="accepted")?(cancelling===t.id?`<select id="why"><option>Changed my mind</option><option>Driver not answering</option><option>Found another driver</option></select><button class="btn ghost" data-a="docanceltrip" data-id="${t.id}">Confirm cancel</button>`:`<button class="btn ghost" data-a="canceltrip" data-id="${t.id}">Cancel</button>`):"";
    return `<div class="card"><div class="row"><b>${esc(t.from_place)} → ${esc(t.to_place)}</b><span class="tag ${g[1]}">${g[0]}</span></div><small>${t.ride_type==="car"?"Car ride · "+esc(t.distance_km)+" km · fixed price "+R(t.price_cents):esc(t.goods_type)}${t.budget_cents?" · your budget "+R(t.budget_cents):""}</small>${body}${act}${can}</div>`}).join("");
  return `<h1>Request a driver</h1><p class="sub">Need a car? Choose Request a car ride: the app uses your phone's location to work out the distance and shows a fixed price. Need to move goods? Choose Move goods, say where from and where to, and drivers on that route accept. You pay the driver in cash. Tap I have arrived safely when you get there.</p>${msgs()}<button class="btn" data-a="newride">Request a car ride</button><button class="btn ghost" style="margin-top:8px" data-a="newreq">Move goods (bakkie or truck)</button>${trips?`<h2 style="margin-top:16px">Your trips</h2>${trips}`:""}`;
}

  ${fld("name","Full name")}${fld("phone","Cellphone number","","tel")}${fld("make","Vehicle make","e.g. Toyota Hilux")}${fld("colour","Vehicle colour")}${fld("plate","Number plate")}
  ${sel("vtype","Vehicle type",[["","Choose your vehicle"],["car","Car (for car rides)"],["bakkie","Bakkie"],["truck","Truck"],["other","Other"]])}${fld("idno","ID number")}

  <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input id="f_consent" type="checkbox" data-a="chk" data-k="consent" ${ST.form.consent?"checked":""}><span>I agree that Eezy Kasi keeps my ID details to check who I am, and shows my name, photo, vehicle and car photo to customers.</span></label>

function earnCard(){
  const e=ST.earn; if(!e) return "";
  const row=(k,l)=>{const x=e[k]||{rides:0,gross_cents:0,kept_cents:0}; return `<div class="row"><span>${l} · ${x.rides} ride${x.rides===1?"":"s"}</span><b>${R(x.kept_cents)}</b></div>`;};
  const a=e.all||{gross_cents:0,kept_cents:0}, pct=a.gross_cents>0?Math.round(a.kept_cents/a.gross_cents*100):85;
  return `<div class="card"><h2>What you kept</h2>${row("today","Today")}${row("week","Last 7 days")}${row("month","This month")}${row("all","All time")}<div class="note">You collect the fare in cash and keep about ${pct}% of it. The app's share is only what appears in your weekly balance below. No hidden charges.</div></div>`;
}
function driver(){
  if(ownView==="pay") return payScreen();
  const me=ST.me; if(!me) return applyScreen();
  const d=ST.dDue||{}, due=d.amount_due_cents||0, offered=new Set(ST.myOffers.map(o=>o.request_id));
  const bn=d.overdue?'<div class="banner bad"><strong>Payment overdue</strong>Customers cannot see you until you pay your balance.</div>':(me.status!=="approved"?'<div class="banner bad"><strong>Your account is not active</strong>Contact Eezy Kasi.</div>':"");
  const carCard=me.car_photo_path?"":carCardHtml();
  const rideList=(ST.rides||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.from_place)} → ${esc(x.to_place)}</b><b>${R(x.price_cents)}</b></div>${x.for_you?'<span class="tag ok">Your regular customer asked for you</span>':x.same_area?'<span class="tag ok">From your kasi</span>':""}<small>${esc(x.distance_km)} km trip · pick-up about ${esc(x.away_km)} km from you${x.pickup_landmark?"<br>Landmark: <b>"+esc(x.pickup_landmark)+"</b>":""}${x.description?"<br>"+esc(x.description):""}</small><button class="btn" data-a="takeride" data-id="${x.id}">Accept · ${R(x.price_cents)}</button><button class="btn ghost" style="margin-top:8px" data-a="declineride" data-id="${x.id}">Reject</button></div>`).join("");
  const rideSec=me.vehicle_type==="car"?`<h2>Car rides near you</h2>${ST.rideErr?`<div class="banner bad">${esc(ST.rideErr)}</div>`:""}${ST.online?`<div class="note">You are online. You see rides with a pick-up within a few kilometres of you, and rides from your own place show first. New ones appear by themselves. Keep this app open on your screen.</div>${rideList||'<div class="card"><small>No car rides near you right now.</small></div>'}<button class="sm" data-a="gooffline">Go offline</button>`:`<div class="note">Go online to see car ride requests close to you. Your location is used only while you are online. Do not fake your location: we keep a record of impossible jumps.</div><button class="btn" data-a="goonline">Go online</button>`}`:"";
  const reqs=ST.openReqs.map(r=>{const rt=ST.myRoutes.find(x=>same(x.from_place,r.from_place)&&same(x.to_place,r.to_place));
    return `<div class="card"><div class="row"><b>${esc(r.from_place)} → ${esc(r.to_place)}</b><b>${rt?R(rt.price_cents):""}</b></div><small>${esc(r.goods_type)}: ${esc(r.description||"")}<br>When: ${esc(r.when_text||"-")}${r.budget_cents?"<br>Customer budget: "+R(r.budget_cents):""}</small>${offered.has(r.id)?'<div class="note">You accepted. Waiting for the customer to choose.</div>':`<button class="btn" data-a="offer" data-id="${r.id}">Accept at ${R(rt?rt.price_cents:0)}</button>`}</div>`}).join("");
  const jobs=ST.jobs.map(j=>{const g=tagFor(j.status), c=ST.contacts[j.id]||{};
    const act=j.status==="accepted"?(j.ride_type==="car"?`<label for="f_pin${j.id}">Ask the customer for their 4-digit PIN</label><input id="f_pin${j.id}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="width:100%;font-size:28px;letter-spacing:10px;text-align:center" value="${esc(ST.form["pin"+j.id]||"")}" data-a="form" data-k="pin${j.id}" placeholder="0000"><button class="btn" data-a="jstartpin" data-id="${j.id}">Start trip</button>`:`<button class="btn" data-a="jstart" data-id="${j.id}">Start trip</button>`):'<div class="note">Trip started. It is finished when the customer taps that they have arrived.</div>';
    return `<div class="card"><div class="row"><b>${esc(j.from_place)} → ${esc(j.to_place)} · ${R(j.price_cents)}</b><span class="tag ${g[1]}">${g[0]}</span></div><p style="margin:4px 0">${esc(j.goods_type)}: ${esc(j.description||"")}</p><small>Pick up: ${esc(c.pickup_text||"")}${j.pickup_landmark?"<br>Landmark: <b>"+esc(j.pickup_landmark)+"</b>":""}<br>When: ${esc(j.when_text||"-")}<br>The customer will text or send you a voice note. Cell numbers are not shared.</small> <button class="sm" data-a="chatwith" data-v="${j.customer_id}">Message customer</button>${j.ride_type==="car"?`<p style="margin:6px 0"><small>${esc(j.distance_km)} km trip · ${navLink(j.pickup_lat,j.pickup_lng,"Navigate to pick-up")} · ${navLink(j.drop_lat,j.drop_lng,"Navigate to drop-off")}</small></p>`:""}${act}</div>`}).join("");
  const routes=ST.myRoutes.map(p=>`<div class="row"><span>${esc(p.from_place)} → ${esc(p.to_place)}</span><span><b>${R(p.price_cents)}</b> <button class="sm" data-a="delroute" data-id="${p.id}">Remove</button></span></div>`).join("");
  if(xtab==="req"){
    const act=(ST.jobs||[]).length;
    const goods=`<h2>${me.vehicle_type==="car"?"Goods requests":"Requests"} for your routes</h2>${reqs||'<div class="card"><small>No customers are asking for your routes right now. Tap Refresh to check.</small></div>'}`;
    return `<h1>Requests</h1><p class="sub">${me.vehicle_type==="car"?"Go online here, then new customer requests appear on this screen.":"Customers asking for your routes appear here."}</p>${bn}${msgs()}
  ${act?`<div class="banner ok"><strong>You have ${act} active job${act===1?"":"s"}</strong><button class="sm" style="margin-top:8px" data-a="xtab" data-v="main">Open My jobs</button></div>`:""}
  ${rideSec}${goods}`;
  }
  return `<h1>${esc(me.full_name)}</h1><p class="sub">Trips are paid weekly.</p>${bn}${msgs()}
  <div class="card"><h2>Balance to pay</h2><div class="row"><span>Trips finished</span><b>${d.jobs_completed||0}</b></div>
    <div class="row"><span>Amount due</span><b class="big">${R(due)}</b></div>
    <div class="note">Pay your balance within 7 days of each trip. If a trip stays unpaid for more than 7 days, customers stop seeing you until you pay.</div>

    ${placeSel("rf","From")}${placeSel("rt","To")}${fld("pprice","Price in rand","e.g. 200","number")}
    <button class="btn" data-a="addroute">Save route price</button></div>`}`;
}
function owner(){
  if(ownView==="pay") return payScreen();
  if(ownView==="stmt") return stmtScreen();
  const sh=ST.shop;
  if(!sh) return `<h1>Your shop</h1>${msgs()}<div class="card"><small>No shop is linked to your login yet. Ask Eezy Kasi to set it up.</small></div>`;
  const d=ST.due||{}, due=d.amount_due_cents||0;
  const bn=sh.status==="paused"?'<div class="banner bad"><strong>Your shop is paused</strong>Customers cannot order until the amount due is paid.</div>':"";
  const open=ST.orders.map(o=>{
    const t=tagFor(o.status), what=(o.order_items||[]).map(l=>l.quantity+"× "+esc(l.name)).join(", ");
    const pk=ST.pickIds&&ST.pickIds.has(o.id), cr=pk?0:Math.round(o.cash_cents*0.05), net=pk?(o.cash_cents-o.shop_cents):(o.cash_cents-o.shop_cents)-cr; let act="";
    if(cancelling===o.id) act=`<select id="why"><option>Customer not answering</option><option>Out of stock</option><option>Shop closed</option><option>Too far to deliver</option></select><button class="btn ghost" data-a="docancel" data-id="${o.id}">Confirm cancel</button>`;
    else act=(o.status==="placed"?`<button class="btn" data-a="accept" data-id="${o.id}">Accept order</button>`:`<button class="btn" data-a="deliver" data-id="${o.id}">${pk?"Collected — cash received":"Delivered — cash collected"}</button>`)+`<button class="btn ghost" data-a="cancel" data-id="${o.id}">Cancel</button>`;
    return `<div class="card"><div class="row"><b>Order #${o.id}</b><span>${pk?'<span class="tag">Pick up</span> ':""}<span class="tag ${t[1]}">${t[0]}</span></span></div><p style="margin:4px 0">${what}</p><p style="margin:4px 0"><small>${pk?"<b>PICK UP</b>: the customer collects at your shop":"Deliver to: "+esc(o.delivery_address)}</small> <button class="sm" data-a="chatwith" data-v="${o.customer_id}">Message customer</button></p>
      <p class="note" style="margin:6px 0">${pk?`The customer pays <b>${R(o.cash_cents)}</b> cash at your shop. You keep your full price of ${R(o.shop_cents)}. The extra ${R(net)} is the app fee the customer pays on top, and you pass it on to Eezy Kasi.`:`Collect <b>${R(o.cash_cents)}</b> cash. You keep ${R(o.shop_cents+cr)}. You owe ${R(net)}.`}</p>${act}</div>`;}).join("");
  const prices=ST.menu.map(i=>`<div class="row"><span>${esc(i.name)}</span><span>Shop R <input type="number" min="1" step="0.5" value="${i.shop_price_cents/100}" data-a="price" data-id="${i.id}" aria-label="Shop price for ${esc(i.name)}"> → delivery <b>${R(i.app_price_cents)}</b> · pick up <b>${R(i.pickup_price_cents||i.shop_price_cents)}</b></span></div>`).join("");
  return `<h1>${esc(sh.name)}</h1><p class="sub">Pay on the 1st of every month.</p>${bn}${msgs()}
  <div class="card"><h2>Amount due</h2>
    <div class="row"><span>Orders delivered</span><b>${d.orders_delivered||0}</b></div>
    <div class="row"><span>Platform fee (25%)</span><b>${R(d.fee_cents||0)}</b></div>
    <div class="row"><span>Delivery credit (5%)</span><b>−${R(d.credit_cents||0)}</b></div>
    <div class="row"><span>Amount due</span><b class="big">${R(due)}</b></div>
    <div class="note">On delivery orders, the 5% delivery credit (R1 on every R20 order) has been taken out, because you deliver those orders yourself. Pick up orders have no credit: you only pass on the extra the customer paid on top of your price.</div>
    <button class="btn" data-a="pay" ${due?"":"disabled"}>Pay amount due</button>
    <button class="btn ghost" data-a="stmt">View monthly statement</button></div>
  <h2>Incoming orders</h2>${open||'<div class="card"><small>No open orders. New orders show up here when you tap Refresh.</small></div>'}
  <h2>Your menu prices</h2><div class="card">${prices||"<small>No menu items yet.</small>"}<div class="note">Customers pay the delivery price or the pick up price in cash. You always keep your full shop price (plus the delivery credit on deliveries).</div></div>`;
}
function stmtScreen(){
  const u=ST.stmt, t=k=>R(u.reduce((a,o)=>a+(o[k]||0),0));
  const rows=u.map(o=>`<tr><td>#${o.id}</td><td>${R(o.cash_cents)}</td><td>${R(o.fee_cents)}</td><td>−${R(o.credit_cents)}</td><td>${R(o.net_due_cents)}</td></tr>`).join("");
  return `<h1>Monthly statement</h1><p class="sub">Delivered orders not yet paid.</p>
  <div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;text-align:right">
    <tr><th style="text-align:left">Order</th><th>Cash</th><th>Fee</th><th>Credit</th><th>You owe</th></tr>${rows}
    <tr><th style="text-align:left">Total</th><th>${t("cash_cents")}</th><th>${t("fee_cents")}</th><th>−${t("credit_cents")}</th><th>${t("net_due_cents")}</th></tr></table>
    <div class="note">Fee is 25% of the app price. The delivery credit is 5% of the app price. You owe the fee minus the credit. Pick-up orders: the customer pays your shop price plus about 15%, rounded up to the next rand. You keep your full shop price and only pass on the extra the customer paid. There is no delivery credit.</div>
    <button class="btn ghost" data-a="back">Back</button></div>`;
}
function payRef(){
  const sa=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Johannesburg"})), mon=sa.toLocaleString("en",{month:"short"}).toUpperCase(), yy=String(sa.getFullYear()).slice(2);
  return user.tab==="drv"?"DRIVER-"+sess.user.id.slice(0,6).toUpperCase()+"-"+String(sa.getDate()).padStart(2,"0")+mon+yy:"SHOP"+String(ST.shop.id).padStart(3,"0")+"-"+mon+yy;
}

let AC=null, soundOn=(()=>{ try{ return localStorage.getItem("inanda_snd")!=="0"; }catch(e){ return true; } })();
let prevUnread=null, seenOrders=null, seenReqs=null;
function unlockAudio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==="suspended") AC.resume(); }catch(e){} }
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
function ding(urgent){
  if(!AC) return;
  try{ const t=AC.currentTime;
    if(urgent){
      // loud alarm for new orders and ride requests: about 5 seconds of a two-tone siren, full volume
      const comp=AC.createDynamicsCompressor(); comp.connect(AC.destination);
      for(let i=0;i<20;i++){ const d=i*.25, o=AC.createOscillator(), g=AC.createGain(); o.type="square"; o.frequency.value=(i%2)?1480:990;
        g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.9,t+d+.01); g.gain.setValueAtTime(.9,t+d+.18); g.gain.linearRampToValueAtTime(0,t+d+.23);
        o.connect(g); g.connect(comp); o.start(t+d); o.stop(t+d+.25); }
      return;
    }
    [[880,0],[1175,.16]].forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.3,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.4);
      o.connect(g); g.connect(AC.destination); o.start(t+d); o.stop(t+d+.45); });
  }catch(e){}
}
function notifyIncoming(urgent){ if(!soundOn) return; unlockAudio(); ding(!!urgent); try{ if(navigator.vibrate) navigator.vibrate(urgent?[500,150,500,150,500,150,500,150,500]:[150,80,150]); }catch(e){} }
function checkIncoming(){
  const cur={}; ST.chats.forEach(c=>{ cur[c.chat_id]=c.unread||0; });
  const hot=ST.chats.some(c=>(c.unread||0)>(prevUnread&&prevUnread[c.chat_id]||0));
  if(prevUnread && hot) notifyIncoming();
  if(ST.thread && inMsgs()) cur[ST.thread]=0;   // an open chat is marked read straight away, so the next new message must ring again
  prevUnread=cur;
}
async function pollWork(){
  if(!user||!sess||document.visibilityState==="hidden") return;
  try{
    if(user.tab==="own"){
      await loadOwner();
      const ids=(ST.orders||[]).filter(o=>o.status==="placed").map(o=>o.id);
      if(seenOrders&&ids.some(i=>!seenOrders.includes(i))) notifyIncoming(true);
      seenOrders=ids;
    }else if(user.tab==="drv"){
      await loadDriver();
      const ids=(ST.openReqs||[]).concat(ST.rides||[]).map(r=>r.id);
      if(seenReqs&&ids.some(i=>!seenReqs.includes(i))) notifyIncoming(true);
      seenReqs=ids;
    }else if(user.tab==="cust"&&cview==="drive"&&!ST.rd&&!ST.req){
      const prev={}; (ST.trips||[]).forEach(t=>{prev[t.id]=t.status;});
      await loadTrips();
      if((ST.trips||[]).some(t=>prev[t.id]==="open"&&t.status==="accepted")) notifyIncoming();
      const ae=document.activeElement; if(!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))&&!cancelling) render();
    }else return;
    const a=document.activeElement, typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
    const picking=[...document.querySelectorAll("input[type=file]")].some(f=>f.files&&f.files.length);   // keep pictures the owner just chose
    if(!typing&&!picking&&(xtab==="main"||(user.tab==="drv"&&xtab==="req"))&&ownView==="due"&&!cancelling) render();
  }catch(e){}
}

async function sb(path,opt={}){
  const r=await fetch(SB_URL+path,{...opt,headers:{apikey:SB_KEY,"Content-Type":"application/json",...(sess?{Authorization:"Bearer "+sess.access_token}:{}),...(opt.headers||{})}});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){ const m=(j&&(j.msg||j.error_description||j.message))||"Something went wrong. Please try again.";
    if(!opt._retry&&sess&&sess.refresh_token&&/jwt expired|invalid jwt|token is expired/i.test(m)){
      try{ await refreshSession(); }catch(e){ throw new Error("Your login ended. Please log out and log in again."); }
      return sb(path,{...opt,_retry:true});
    }
    throw new Error(/captcha/i.test(m)?"The security check did not pass. Wait a moment for it to finish, then try again.":m); }
  return j;
}

function troubleBlock(){
  if(ST.troubleSent) return '<div class="banner ok" style="margin-top:12px"><strong>Thank you</strong>We got your message and will help you as soon as we can.</div>';
  if(!ST.trouble) return '<p style="margin:12px 0"><button class="sm" type="button" data-a="trouble">Having trouble? Tell us</button></p>';
  return `<div class="card" style="margin-top:12px"><h2>Having trouble?</h2>${ST.troubleErr?`<div class="banner bad">${esc(ST.troubleErr)}</div>`:""}<label for="f_tmsg">What went wrong?</label><textarea id="f_tmsg" rows="4" maxlength="500" style="width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)" data-a="form" data-k="tmsg" placeholder="For example: the photo button does nothing">${esc(ST.form.tmsg||"")}</textarea>${fld("tcontact","Your cell number so we can call or WhatsApp you (optional)","e.g. 081 234 5678","tel")}<div class="note">We also send the last error you saw and your phone type, so we can find the problem. We never see your password.</div><button class="btn" data-a="troublesend">Send to Eezy Kasi</button><button class="btn ghost" data-a="troublecancel">Cancel</button></div>`;
}
function friendlyAuth(m){
  m=String(m||"");
  if(/already (been )?registered|user_already_exists|already exists/i.test(m)) return "That email already has an account. Tap Back to log in and log in. If you forgot your password, tap Forgot password?";
  if(/only request this once|for security purposes|after \d+ seconds/i.test(m)) return "Please wait a minute, then tap the button again.";
  if(/rate limit|too many requests|over_email_send_rate_limit/i.test(m)) return "Too many people are signing up right now. Please wait a few minutes and try again. If it keeps happening, tap Having trouble? below.";
  if(/failed to fetch|networkerror|load failed/i.test(m)) return "No internet connection. Check your data or Wi-Fi and try again.";
  return m;
}

async function doSetPw(){

function playCard(c){
  document.querySelectorAll(".vcard video").forEach(v=>v.pause());
  if(c.querySelector("video")||!c.dataset.src) return;
  const v=document.createElement("video"); v.src=c.dataset.src; v.controls=true; v.preload="auto"; v.setAttribute("playsinline","");
  v.addEventListener("error",()=>{c.classList.remove("playing"); c.classList.add("verr"); v.remove();});
  new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) v.pause(); }),{threshold:.4}).observe(c);
  c.classList.add("playing"); c.classList.remove("verr"); c.appendChild(v); v.play().catch(()=>{});
}

ears.</p> <h3>Drivers</h3>

    '#app[data-ctx=own] .col{display:contents}' +
    '.stabs{display:none!important}' +
    '#app>.grp>button.sm{width:auto}' +
    '}' +
    '@media (max-width:899px){' +
    '.cols,.col{display:contents}' +
    '.grp.off{display:none}' +
    '.stabs{flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:5;background:transparent;padding:6px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}' +
    '.stabs::-webkit-scrollbar{display:none}' +
    '.stabs button{flex:1 0 auto;padding:10px 14px;white-space:nowrap}' +
    '}';
  document.head.appendChild(st);

  function isWide() {
    if (!user) return false;
    if (tab === "cust") return ["home", "food", "build", "beauty"].includes(cview);
    if (tab === "own" || tab === "drv" || tab === "adm") return (xtab === "main" || (tab === "drv" && xtab === "req")) && ownView === "due";
    return false;
  }

  // ---- which screens are grouped, and how ----
  const DEF = {
    shop: { tabs: [["order", "Menu"], ["pics", "Pictures"], ["mine", "My orders"]], full: [], c1: ["order", "mine"], c2: ["pics"] },
    home: { tabs: [["svc", "Services"], ["vid", "Advertising"], ["news", "News"]], full: ["svc"], c1: ["vid", "news"], c2: [] },
    own:  { tabs: [["orders", "Orders"], ["money", "Money"], ["menu", "Menu"], ["hours", "Hours"], ["posts", "Posts"], ["videos", "Videos"]], full: [], c1: ["orders", "money", "menu", "hours", "posts", "videos"], c2: [] }
  };
  const OWN_H = { "Incoming orders": "orders", "Your menu prices": "menu", "Manage your menu": "menu", "Trading hours": "hours",
    "Menu and pictures": "posts", "Recent shop posts": "posts", "Show your work": "posts", "Our work": "posts", "Your trade and places": "posts",
    "Promote your business": "videos", "Owner videos": "videos" };
  const sel = {};
  const DESK = window.matchMedia("(min-width:900px)");
  const onSize = () => { if (user) render(); };
  if (DESK.addEventListener) DESK.addEventListener("change", onSize); else if (DESK.addListener) DESK.addListener(onSize);

  function ctxName() {
    if (!user) return null;
    if (tab === "cust") { if (ST.shop && ["food", "build", "beauty"].includes(cview)) return "shop"; if (cview === "home") return "home"; return null; }
    if (tab === "own" && xtab === "main" && ownView === "due" && ST.shop) return "own";
    return null;
  }
  const headText = el => { const h = el.tagName === "H2" ? el : el.querySelector(":scope>h2"); return h ? (h.dataset.en || h.textContent.trim()) : ""; };
  function classify(c, el) {
    const t = headText(el), card = el.classList && el.classList.contains("card");
    if (c === "shop") {
      if (el.tagName === "H2" && (t === "Menu and pictures" || t === "Recent work" || t === "Our work")) return "pics";
      if (card && el.querySelector('[data-a="order"]')) return "order";
      if (card && t === "Your orders") return "mine";
    } else if (c === "home") {
      if (el.tagName === "H1") return "svc";
      const l = el.getAttribute && el.getAttribute("aria-label");
      if (l === "Funny videos") return "vid";
      if (l === "Inanda news") return "news";
    } else if (c === "own") {
      if (el.tagName === "H2" && OWN_H[t]) return OWN_H[t];
      if (card && t === "Amount due") return "money";
    }
    return null;
  }

  function organize() {
    const app = document.getElementById("app"); if (!app) return;
    const c = ctxName();
    if (!c) { app.removeAttribute("data-ctx"); return; }
    const def = DEF[c], grps = {}; let cur = null;
    [...app.children].forEach(el => {
      let g = classify(c, el);
      if (!g && el.tagName === "BUTTON") g = c === "home" ? "svc" : cur;
      if (g) cur = g;
      if (!cur) return;
      if (!grps[cur]) { const d = document.createElement("div"); d.className = "grp"; d.dataset.g = cur; grps[cur] = d; }
      grps[cur].appendChild(el);
    });
    const have = def.tabs.filter(t => grps[t[0]]);
    if (!have.length) { app.removeAttribute("data-ctx"); return; }
    app.dataset.ctx = c;
    def.full.forEach(g => { if (grps[g]) app.appendChild(grps[g]); });
    const cols = document.createElement("div"); cols.className = "cols";
    const c1 = document.createElement("div"), c2 = document.createElement("div"); c1.className = c2.className = "col";
    def.c1.forEach(g => { if (grps[g]) c1.appendChild(grps[g]); });
    def.c2.forEach(g => { if (grps[g]) c2.appendChild(grps[g]); });
    if (c1.children.length) cols.appendChild(c1); if (c2.children.length) cols.appendChild(c2);
    if (cols.children.length < 2) cols.classList.add("one");
    if (cols.children.length) app.appendChild(cols);
    if (have.length > 1) {
      const bar = document.createElement("div"); bar.className = "seg stabs"; bar.setAttribute("role", "tablist");
      bar.innerHTML = have.map(([k, l]) => {
        const n = k === "orders" ? grps[k].querySelectorAll('[data-a="accept"],[data-a="deliver"]').length : 0;
        return '<button role="tab" data-a="stab" data-v="' + k + '" data-n="' + l + '">' + l + (n ? " (" + n + ")" : "") + '</button>';
      }).join("");
      const nav = [...app.children].find(x => x.classList && x.classList.contains("seg"));
      if (nav) nav.insertAdjacentElement("afterend", bar); else app.insertBefore(bar, app.firstChild);
      if (!sel[c] || !grps[sel[c]]) sel[c] = c === "shop" && cview === "beauty" && grps.pics ? "pics" : have[0][0];
      applyTabs();
    }
  }
  function applyTabs() {
    const app = document.getElementById("app"), c = app && app.dataset.ctx; if (!c) return;
    app.querySelectorAll(".grp").forEach(g => g.classList.toggle("off", g.dataset.g !== sel[c]));
    app.querySelectorAll(".stabs button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.v === sel[c])));
  }
  H.stab = el => { const app = document.getElementById("app"), c = app && app.dataset.ctx; if (c) { sel[c] = el.dataset.v; applyTabs(); window.scrollTo({ top: 0 }); } return Promise.resolve(); };

  const _render = render;
  render = function () {
    _render();
    const m = document.querySelector("main");
    if (m) m.classList.toggle("wide", isWide());
    try { organize(); } catch (e) {}
  };
})();
</script>

<script>
// ---- push alerts: each person chooses; works with the app closed ----
(function () {
  const VAPID = "BCRhllUIPk7lgblm7h3-eqohJJzvABrk10jh66LKXegBuXLqX638jgpK_QlNaxtSKzwDLG4zgptvR4hDH5-odOM";
  const supported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const getKey = () => { try { return localStorage.getItem("inanda_push") || ""; } catch (e) { return ""; } };
  const setKey = v => { try { localStorage.setItem("inanda_push", v); } catch (e) {} };
  const u8 = b64 => { const s = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
  async function enable() {
    if (!supported()) throw new Error("This phone or browser cannot show alerts while the app is closed. On an iPhone, add the app to your Home Screen first.");
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { setKey("no"); throw new Error("Alerts are blocked. Allow notifications for this app in your phone settings, then try again."); }
    const r = await navigator.serviceWorker.ready; let sub = await r.pushManager.getSubscription();
    if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(VAPID) });
    const j = sub.toJSON();
    await rpc("save_push_sub", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    setKey("on");
  }
  async function disable() {
    try { const r = await navigator.serviceWorker.ready, sub = await r.pushManager.getSubscription();
      if (sub) { try { await rpc("drop_push_sub", { p_endpoint: sub.endpoint }); } catch (e) {} await sub.unsubscribe(); } } catch (e) {}
    setKey("off");
  }
  H.pushon = () => go(async () => { await enable(); ST.note = "Alerts are on. You will hear a sound when something new arrives, even when the app is closed."; });
  H.pushno = () => { setKey("no"); };
  H.pushreload = () => { location.reload(); };
  const _snd = H.sndtoggle;
  H.sndtoggle = () => {
    _snd();
    if (!soundOn) { disable(); return; }
    if (supported() && Notification.permission !== "denied") return go(async () => { try { await enable(); } catch (e) {} });
  };
  const _lo = H.logout;
  H.logout = () => {   // a phone that logs out must stop receiving that person's alerts
    const tok = sess && sess.access_token;
    try { if (tok && supported()) navigator.serviceWorker.ready.then(r => r.pushManager.getSubscription()).then(s => { if (s) fetch(SB_URL + "/rest/v1/rpc/drop_push_sub", { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ p_endpoint: s.endpoint }) }).catch(() => {}).then(() => s.unsubscribe()); }).catch(() => {}); } catch (e) {}
    synced = null; return _lo();
  };
  let synced = null;
  const _render = render;
  render = function () {
    _render();
    if (!user || user.tab === "pend") return;
    const app = document.getElementById("app"), crit = user.tab === "drv" || user.tab === "own";
    // drivers and shop owners live on these alerts, so if alerts are not working on this phone the app says so, every time
    if (crit && soundOn && app && !app.querySelector(".pushfix")) {
      let msg = "", btn = "";
      if (!supported()) msg = "<strong>Alerts cannot work in this browser</strong>You will not hear new requests or orders while the app is closed. Open the app in Chrome (Android) or Safari (iPhone), and on an iPhone add it to your Home Screen first. If you opened it from WhatsApp or Facebook, tap the menu and choose Open in Chrome.";
      else if (Notification.permission === "denied") { msg = "<strong>Alerts are blocked for this app in Chrome</strong>You will not hear new requests or orders while the app is closed. Even when Chrome notifications are on in your phone settings, Chrome keeps a separate block for this website. To clear it: tap the lock or settings icon next to the web address (or the three dots, then Settings), choose Permissions or Site settings, tap Notifications, and choose Allow. If you installed the app on your Home Screen, press and hold its icon, tap the i, then Notifications, and turn them on. Then tap the button below."; btn = '<button class="btn" data-a="pushreload">I allowed it, check again</button>'; }
      else if (getKey() !== "on") { msg = "<strong>Alerts are OFF on this phone</strong>You will not hear new requests or orders while the app is closed. Tap the button, then tap Allow when your phone asks."; btn = '<button class="btn" data-a="pushon">Turn on alerts</button>'; }
      if (msg) { const d = document.createElement("div"); d.className = "banner bad pushfix"; d.innerHTML = msg + btn; const first = app.querySelector(".seg"); if (first) first.insertAdjacentElement("afterend", d); else app.insertBefore(d, app.firstChild); }
    }
    if (!supported()) return;
    if (getKey() === "" && !crit && Notification.permission !== "denied" && app && !app.querySelector(".pushask")) {
      const d = document.createElement("div"); d.className = "card pushask";
      d.innerHTML = '<b>Get alerts with sound</b><p style="margin:6px 0 10px">Hear a sound when you get a message, an order or a trip request, even when the app is closed. You can turn it off any time with the bell at the top.</p><button class="btn" data-a="pushon">Turn on alerts</button><button class="btn ghost" data-a="pushno">Not now</button>';
      const first = app.querySelector(".seg"); if (first) first.insertAdjacentElement("afterend", d); else app.insertBefore(d, app.firstChild);
    }
    const id = sess && sess.user && sess.user.id;
    if (id && synced !== id) { synced = id; if (getKey() === "on" && Notification.permission === "granted") enable().catch(() => {}); }   // keeps this phone linked to whoever is logged in
  };
})();
</script>


<script>
// ---- founder page: button above the logo once signed in; the admin can change the photo and both quotes ----
(function () {
  const DEF = {
    photo: "",
    q1: "The best is yet to come.",
    q2: "A creator never forgets his creation, and a creation never forgets its creator. Wake up every day with new energy and fresh ideas, because this world is full of opportunities. No fall is the end of the story. Even after a fall from grace, you can rise again, stronger than before."
  };
  let data = Object.assign({}, DEF), editing = false, msg = "", bad = false, busy = false;
  const isAdmin = () => typeof user !== "undefined" && user && user.tab === "adm";

  function vis() {
    const r = document.getElementById("founderrow");
    if (r) r.hidden = !(typeof user !== "undefined" && user);
  }
  async function load() {
    try {
      const r = await sb("/rest/v1/founder_page?select=photo_url,quote1,quote2&id=eq.1");
      if (r && r[0]) data = { photo: r[0].photo_url || "", q1: r[0].quote1 || DEF.q1, q2: r[0].quote2 || DEF.q2 };
    } catch (e) {}
  }
  function html() {
    const photo = data.photo
      ? '<img src="' + esc(data.photo) + '" alt="Our founder" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee">'

    let h = '<div role="dialog" aria-modal="true" aria-label="Meet our founder" style="width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;line-height:1.5">' +
      '<div style="text-align:right"><button class="sm" data-founder="close" id="founderclose">Close</button></div>' +
      '<div class="fcap">Meet our founder</div>' +
      '<div style="width:160px;height:160px;border-radius:50%;padding:4px;margin:12px auto 6px;background:linear-gradient(135deg,#e7c76a,#b8892b 55%,#0f766e)">' + photo + '</div>' +
      '<div class="fq1"><span class="fmark">&ldquo;</span><p>' + esc(data.q1) + '</p><div class="fbar"></div></div>' +
      '<div class="fgap"><span>&#9670;</span><span>&#9670;</span><span>&#9670;</span></div>' +
      '<div class="fq2"><p>' + esc(data.q2) + '</p><span class="fmark">&rdquo;</span></div>' +
      '<div style="text-align:center;margin:18px 0 4px"><div style="width:46px;height:3px;border-radius:3px;margin:0 auto 10px;background:linear-gradient(90deg,#e7c76a,#0f766e)"></div><div style="font:800 21px/1.2 Georgia,serif;letter-spacing:.02em">Lufefe Melane</div><div class="fcap" style="margin-top:5px">Founder, Eezy Kasi</div></div>' +
      '<div style="margin:18px 0 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)">' +
        '<div class="fcap" style="text-align:center">Our mission</div>' +
        '<p style="margin:6px 0 14px;text-align:center">To help people own something that will bear fruit for them and for their grandchildren, by using technology to open doors to local businesses, safe transport and fair opportunities, especially for those who cannot easily access the resources they need.</p>' +
        '<div style="width:46px;height:3px;border-radius:3px;margin:0 auto 12px;background:linear-gradient(90deg,#e7c76a,#0f766e)"></div>' +
        '<div class="fcap" style="text-align:center">Our vision</div>' +
        '<p style="margin:6px 0 0;text-align:center">A better South Africa where the young and the old make use of technology to turn their dreams into reality, and where every family can build something that lasts for generations.</p>' +
      '</div>';
    if (msg) h += '<div class="note" style="' + (bad ? 'color:var(--bad);background:var(--bad-bg)' : 'color:var(--ok);background:var(--ok-bg)') + '" role="status">' + esc(msg) + '</div>';
    if (isAdmin()) {
      if (!editing) {
        h += '<p style="text-align:center;margin:14px 0 0"><button class="sm" data-founder="edit">Edit this page</button></p>';
      } else {
        h += '<div class="card" style="margin:14px 0 0"><h3 style="margin:0 0 6px">Edit the founder page</h3>' +
          '<label for="f_file">Change the photo (leave empty to keep the current one)</label><input id="f_file" type="file" accept="image/*">' +
          '<label for="f_q1">First quote</label><textarea id="f_q1" rows="2">' + esc(data.q1) + '</textarea>' +
          '<label for="f_q2">Second quote</label><textarea id="f_q2" rows="5">' + esc(data.q2) + '</textarea>' +
          '<button class="btn" data-founder="save"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Saving...' : 'Save') + '</button>' +
          '<button class="btn ghost" data-founder="cancel">Cancel</button></div>';
      }
    }
    return h + '<button class="btn" data-founder="close" style="margin-top:14px">Close</button></div>';
  }
  function paint() {
    const p = document.getElementById("founderpanel"); if (!p || p.hidden) return;
    const keep = p.firstElementChild ? p.firstElementChild.scrollTop : 0;
    p.innerHTML = html();
    if (p.firstElementChild) p.firstElementChild.scrollTop = keep;
  }
  async function open() {
    const p = document.getElementById("founderpanel"); if (!p) return;
    editing = false; msg = ""; p.hidden = false; paint();
    const c = document.getElementById("founderclose"); if (c) c.focus();
    await load(); paint();
  }
  function close() { const p = document.getElementById("founderpanel"); if (p) { p.hidden = true; p.innerHTML = ""; } editing = false; msg = ""; }
  async function save() {
    if (busy) return;
    const q1 = (document.getElementById("f_q1").value || "").trim(), q2 = (document.getElementById("f_q2").value || "").trim();
    if (!q1 || !q2) { msg = "Both quotes need some text."; bad = true; paint(); return; }

      if (!r || !r.length) throw new Error("Could not save. The founder page table or admin permission is not set up yet.");

  }
  document.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest("[data-founder]"), p = document.getElementById("founderpanel");
    if (el) {
      const a = el.dataset.founder;
      if (a === "open") open();
      else if (a === "close") close();
      else if (a === "edit") { editing = true; msg = ""; paint(); }
      else if (a === "cancel") { editing = false; msg = ""; paint(); }
      else if (a === "save") save();
    } else if (p && e.target === p) close();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { const p = document.getElementById("founderpanel"); if (p && !p.hidden) close(); } });
  const bar = document.getElementById("bar");
  if (bar) new MutationObserver(vis).observe(bar, { childList: true, subtree: true });
  vis();
})();
</script>

})();
