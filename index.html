<!DOCTYPE html>
<html lang="en">
<head>
<meta
  charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inanda Business Web</title>
<meta name="theme-color" content="#f3f3f1">
<meta name="description" content="Inanda Business Web - Kubamba ezingelayo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f3f1;--surface:#fff;--ink:#111;--muted:#555;--line:#d4d4d0;--accent:#111;--on-accent:#fff;--bad:#b3261e;--bad-bg:#fdeceb;--ok:#14683d;--ok-bg:#e6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.demo button,.sm{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
h1{font-size:22px;font-weight:800;margin:0 0 2px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.btn{width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;margin-top:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner strong{display:block;font-size:16px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
input[type=number],input[type=text],select{font:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:90px}
select{width:100%;margin:6px 0}
.ref{font-weight:800;letter-spacing:.02em}
small{color:var(--muted)}
header{text-align:center;margin:6px 0 14px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.zu{font-size:12px;font-style:italic;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.zu.ink{font-style:normal;font-weight:600;letter-spacing:.22em;margin-top:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.bar:empty{display:none}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=password],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areas button{font:inherit;font-weight:600;font-size:15px;padding:18px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.areas button:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 2px}
.sec-h h2{margin:0}.muted{font-size:12px;color:var(--muted)}
.vbar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px;margin:0 -2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.vbar::-webkit-scrollbar{display:none}
.vcard{position:relative;flex:0 0 150px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;scroll-snap-align:start;background:linear-gradient(160deg,#111,#3a3a3a);cursor:pointer;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .2s}
.vcard:hover{transform:translateY(-2px)}
.vcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 55%);pointer-events:none}
.vplay{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;z-index:2;transition:transform .2s}
.vcard:hover .vplay{transform:scale(1.1)}
.vtitle{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;font-weight:600;font-size:13px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;background:#000}
.vcard.playing::after,.vcard.playing .vplay,.vcard.playing .vtitle{display:none}
.vcard.verr::before{content:"Connect to the internet to watch";position:absolute;left:10px;right:10px;bottom:44px;z-index:4;font-size:12px;background:rgba(0,0,0,.65);padding:6px 8px;border-radius:8px}
@media (min-width:520px){.vcard{flex-basis:170px}}
@media (prefers-reduced-motion:reduce){.vcard,.vplay{transition:none}}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.nimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg)}
.nbody{padding:14px 16px 4px}
.nmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.nlive{font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.ncard h3{margin:0 0 6px;font-size:18px;line-height:1.25}
.ntext{margin:0;font-size:15px}
.ntext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nmore{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer;text-decoration:underline}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);margin-top:6px}
.nfoot a{font-size:13px;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;padding:5px 12px 5px 5px;border-radius:999px}
.bav{width:22px;height:22px;border-radius:50%;background:var(--on-accent);color:var(--accent);display:grid;place-items:center;font-size:12px}
.seg{flex-wrap:wrap}.seg button{flex:1 1 90px}
.chatlog{max-height:55vh;min-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.bt{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar>button{flex:0 0 auto}
body:has(.chatbar) .wishbtn{display:none!important}
.chatbar input{flex:1;min-width:0;width:auto;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chatrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.chatmeta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dot{display:inline-block;margin-left:6px;min-width:20px;padding:2px 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;text-align:center}
details.privnote{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
details.privnote summary{cursor:pointer;font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--ink);font-size:14px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 20px}
.cat{font:inherit;font-weight:800;font-size:19px;min-height:112px;padding:16px 8px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cat .ci{font-size:36px;line-height:1}
.cat:active{transform:scale(.98)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.post img{display:block;width:100%;border-radius:10px;background:var(--bg);object-fit:cover;aspect-ratio:4/3}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba figure{margin:0}.ba img{aspect-ratio:3/4}
.ba figcaption{font-size:13px;font-weight:800;text-align:center;margin-top:4px}
.pcap{margin:8px 2px 6px;font-size:15px}
.post img.one{aspect-ratio:auto;height:auto;max-height:70vh;object-fit:contain;margin:0 auto}
details.mem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
details.mem summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;font-size:15px}
details.mem summary::-webkit-details-marker{display:none}
details.mem[open] summary{margin-bottom:8px}
.mem-info{font-size:14px;line-height:1.6}
.rep-log{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border-radius:10px;margin:8px 0}
textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{padding-bottom:84px}
.wishbtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
#wishpanel,#legalpanel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#wishpanel[hidden],#legalpanel[hidden]{display:none}
.legalfoot{text-align:center;padding:0 12px 96px}
#legalpanel h3{margin:14px 0 4px;font-size:15px}
#legalpanel p,#legalpanel li{font-size:14px;margin:4px 0}
#legalpanel ul{padding-left:20px;margin:4px 0}
.pw-wrap { position: relative; display: block; }
.pw-wrap input { width: 100%; box-sizing: border-box; padding-right: 48px; }
.pw-eye {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; padding: 8px; cursor: pointer;
  font-size: 18px; line-height: 1;
}</style>
</head>
<body>
<main>
  <header><div class="brand">Inanda Business Web</div><div class="zu ink">I.N.K</div><div class="zu">Kubamba ezingelayo</div></header>
  <div class="bar" id="bar"></div>
  <div id="install"></div>
  <div id="app"></div>
  <div id="logo" style="text-align:center;margin:20px auto 8px;max-width:220px"></div>
</main>
<div class="legalfoot"><button class="sm" type="button" data-legal="open">Privacy policy and terms</button></div>
<button id="wishbtn" class="wishbtn" type="button">📝 Wish list</button>
<div id="wishpanel" hidden></div>
<div id="legalpanel" hidden></div>
<script>
const R = c => "R" + (c/100).toFixed(2);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="cust", ownView="due", cancelling=null, user=null, loc=null, locId=null;
const dispName=()=>{ const p=ST.profile||{}, n=((p.name||"")+" "+(p.surname||"")).trim(); if(n) return n; if(ST.shop&&ST.shop.name) return ST.shop.name; if(ST.me&&ST.me.full_name) return ST.me.full_name; return ROLES[user.tab]||""; };
const ROLES={cust:"Customer",own:"Shop owner",adm:"Admin",drv:"Driver",pend:"Your account"};
let cview="home", xtab="main";
const blank=()=>({areas:[],shops:[],shop:null,menu:[],cart:{},address:"",orders:[],due:{},stmt:[],mine:[],all:[],err:"",note:"",offers:[],trips:[],me:null,myRoutes:[],openReqs:[],myOffers:[],contacts:{},jobs:[],dDue:{},pend:[],pays:[],xtrips:[],form:{nsrc:"Chris"},chats:[],thread:null,msgs:[],threadWith:null,unread:0,profile:{},req:false,news:[],vids:[],feedErr:"",reporting:false,members:[],reports:[],atab:"over",mfilter:"pending",openm:{},custAppr:false,membersErr:"",shopApp:null});
let ST=blank();
const tagFor = st => ({placed:["New","bad"],accepted:["Accepted",""],delivered:["Delivered","ok"],cancelled:["Cancelled",""],open:["Waiting for drivers","bad"],requested:["Waiting for driver","bad"],started:["Trip started",""],declined:["Declined",""],completed:["Arrived safely","ok"]}[st]||[st,""]);
const rpc=(fn,args)=>sb("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(args)});
async function go(fn){ ST.err=""; ST.note=""; try{await fn();}catch(e){ST.err=e.message;ST.note="";} render(); if(ST.err||ST.note) window.scrollTo({top:0,behavior:"smooth"}); }
const msgs=()=>(ST.err?`<div class="banner bad">${esc(ST.err)}</div>`:"")+(ST.note?`<div class="banner ok">${esc(ST.note)}</div>`:"");

// ---- loading real data from the database ----
async function loadAreas(){ ST.areas=await sb("/rest/v1/areas?select=id,name&order=id"); }
async function loadCust(){
  ST.shops=[];
  if(locId){
    try{ ST.shops=await sb(`/rest/v1/shops?select=id,name,owner_id,category&area_id=eq.${locId}&order=id`); }
    catch(e){ ST.shops=(await sb(`/rest/v1/shops?select=id,name,owner_id&area_id=eq.${locId}&order=id`)).map(x=>({...x,category:"food"})); }
  }
  ST.mine=await sb(`/rest/v1/orders?select=id,status,cash_cents&customer_id=eq.${sess.user.id}&order=id.desc&limit=8`);
  ST.pickMine=new Set(); try{ (await sb(`/rest/v1/orders?select=id&customer_id=eq.${sess.user.id}&pickup=eq.true&order=id.desc&limit=30`)).forEach(x=>ST.pickMine.add(x.id)); }catch(e){}
  await loadTrips();
}
async function loadMenu(shop){
  ST.shop=shop; ST.cart={};
  ST.menu=await sb(`/rest/v1/menu_items?select=id,name,app_price_cents,shop_price_cents&shop_id=eq.${shop.id}&is_available=eq.true&order=id`);
  ST.posts=[]; try{ ST.posts=await sb(`/rest/v1/shop_posts?select=id,caption,image_url,before_url&shop_id=eq.${shop.id}&order=id.desc&limit=12`); }catch(e){}
}
async function loadOwner(){
  const sh=await sb(`/rest/v1/shops?select=id,name,status&owner_id=eq.${sess.user.id}&limit=1`);
  ST.shop=sh[0]||null; if(!ST.shop){ST.orders=[];ST.menu=[];ST.due={};ST.stmt=[];return;}
  const id=ST.shop.id, base=`/rest/v1/orders?shop_id=eq.${id}`;
  const r=await Promise.all([
    sb(base+"&select=id,status,cash_cents,shop_cents,delivery_address,customer_id,order_items(name,quantity)&status=in.(placed,accepted)&order=id"),
    sb(`/rest/v1/menu_items?select=id,name,shop_price_cents,app_price_cents&shop_id=eq.${id}&order=id`),
    sb(`/rest/v1/shop_amount_due?select=*&shop_id=eq.${id}`),
    sb(base+"&select=id,cash_cents,fee_cents,credit_cents,net_due_cents&status=eq.delivered&payment_id=is.null&order=id")]);
  ST.orders=r[0]; ST.menu=r[1]; ST.due=r[2][0]||{}; ST.stmt=r[3];
  ST.pickIds=new Set(); try{ (await sb(`/rest/v1/orders?select=id&shop_id=eq.${id}&pickup=eq.true&status=in.(placed,accepted)`)).forEach(x=>ST.pickIds.add(x.id)); }catch(e){}
  ST.myPosts=[]; try{ ST.myPosts=await sb(`/rest/v1/shop_posts?select=id,caption,image_url,before_url&shop_id=eq.${id}&order=id.desc`); }catch(e){}
}
async function loadAdmin(){
  const r=await Promise.all([sb("/rest/v1/shops?select=id,name,status&order=id"),sb("/rest/v1/shop_amount_due?select=*"),
    sb("/rest/v1/drivers?select=id,full_name,cellphone,vehicle_make,vehicle_colour,plate_number,driver_private(id_number)&status=eq.pending"),
    sb("/rest/v1/payments?select=id,payer_type,reference,amount_cents&status=eq.pending&order=id"),
    sb("/rest/v1/transport_requests?select=id,from_place,to_place,price_cents,started_at&status=eq.started&order=id")]);
  ST.all=r[0].map(s=>({...s,...(r[1].find(d=>d.shop_id===s.id)||{})})); ST.pend=r[2]; ST.pays=r[3]; ST.xtrips=r[4];
  try{ ST.members=await rpc("admin_members",{}); ST.membersErr=""; }catch(e){ ST.members=[]; ST.membersErr=e.message; }
  try{ ST.reports=await rpc("admin_reports",{}); }catch(e){ ST.reports=[]; }
  try{ const cs=await sb("/rest/v1/platform_settings?select=customers_need_approval&id=eq.1"); ST.custAppr=!!(cs&&cs[0]&&cs[0].customers_need_approval); }catch(e){}
  ST.pendOwn=[];
  ST.recentPosts=[]; try{ ST.recentPosts=await sb("/rest/v1/shop_posts?select=id,caption,image_url,before_url,shop_id,shops(name)&order=id.desc&limit=12"); }catch(e){}
  try{
    let ap; try{ ap=await sb("/rest/v1/shop_applications?select=user_id,shop_name,shop_address,area_name,category&order=created_at"); }
    catch(e){ ap=(await sb("/rest/v1/shop_applications?select=user_id,shop_name,shop_address,area_name&order=created_at")).map(a=>({...a,category:"food"})); }
    if(ap.length){
      const pr=await sb("/rest/v1/profiles?select=id,name,surname,phone&role=eq.customer&id=in.("+ap.map(a=>a.user_id).join(",")+")");
      ST.pendOwn=pr.map(x=>({...x,app:ap.find(a=>a.user_id===x.id)}));
    }
  }catch(e){}
}
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4); if(m<1)return "just now"; if(m<60)return m+" min ago"; const h=Math.round(m/60); if(h<24)return h+(h===1?" hour ago":" hours ago"); const d=Math.round(h/24); return d+(d===1?" day ago":" days ago");};
async function loadFeed(fresh){
  const o=fresh?{cache:"no-store"}:{};
  try{
    const r=await Promise.all([
      sb("/rest/v1/inanda_news?select=id,title,body,image_url,source_name,source_url,posted_at&is_published=eq.true&order=posted_at.desc&limit=6",o),
      sb("/rest/v1/funny_videos?select=id,title,video_url,poster_url,created_at&is_published=eq.true&order=created_at.desc&limit=20",o)]);
    ST.news=r[0]; ST.vids=r[1]; ST.feedErr="";
  }catch(e){ ST.feedErr=navigator.onLine===false?"offline":e.message; }
}
async function uploadMedia(file,folder){

  if(!r.ok){ let m=""; try{m=(await r.json()).message||"";}catch(e){} throw new Error("Could not upload"+(m?": "+m:"")+" (code "+r.status+")"); }
  return `${SB_URL}/storage/v1/object/public/inanda-media/${path}`;

function grabFrame(src,local){
  return new Promise((resolve,reject)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload=local?"auto":"metadata";
    if(!local) v.crossOrigin="anonymous";
    const end=(fn,x)=>{ clearTimeout(t); v.removeAttribute("src"); try{v.load();}catch(e){} fn(x); };
    const t=setTimeout(()=>end(reject,new Error("timeout")),20000);
    v.addEventListener("error",()=>end(reject,new Error("cannot read video")));
    v.addEventListener("loadedmetadata",()=>{ v.currentTime=Math.max(.3,Math.min(1.5,(v.duration||3)*.1)); });
    v.addEventListener("seeked",()=>{
      try{
        const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
        c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>b?end(resolve,b):end(reject,new Error("no frame")),"image/jpeg",.8);
      }catch(e){ end(reject,e); }
    },{once:true});
    v.src=src;
  });
}

async function shrink(file){
  try{ const bmp=await createImageBitmap(file), k=Math.min(1,1280/Math.max(bmp.width,bmp.height));

    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8)); return blob||file;
  }catch(e){ return file; }
}

const REASONS=[["abuse","Abuse or insults"],["scam","Scam or asking for money"],["spam","Spam"],["unsafe","I feel unsafe"],["other","Something else"]];

const kindOf=m=>m.m_role==="admin"?"admin":(m.m_role==="driver"||m.m_driver_status)?"driver":m.m_role==="owner"?"owner":(m.m_requested==="driver"||m.m_requested==="owner")?m.m_requested:"customer";

  if(k==="owner") extra=m.m_shop?`Shop: ${esc(m.m_shop)}<br>Address: ${esc(m.m_shop_address||"-")}<br>`:(m.m_role==="owner"?"":"<small>Has not given shop details.</small><br>");

function ding(){
  if(!AC) return;
  try{ const t=AC.currentTime;
    [[880,0],[1175,.16]].forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.3,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.4);
      o.connect(g); g.connect(AC.destination); o.start(t+d); o.stop(t+d+.45); });
  }catch(e){}
}

  const hot=ST.chats.some(c=>(c.unread||0)>(prevUnread&&prevUnread[c.chat_id]||0));
  if(prevUnread && hot) notifyIncoming();

function playCard(c){
  document.querySelectorAll(".vcard video").forEach(v=>v.pause());
  if(c.querySelector("video")||!c.dataset.src) return;
  const v=document.createElement("video"); v.src=c.dataset.src; v.controls=true; v.preload="auto"; v.setAttribute("playsinline","");
  v.addEventListener("error",()=>{c.classList.remove("playing"); c.classList.add("verr"); v.remove();});
  new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) v.pause(); }),{threshold:.4}).observe(c);
  c.classList.add("playing"); c.classList.remove("verr"); c.appendChild(v); v.play().catch(()=>{});
}

<li>Only the two people in a chat can read it and play its voice notes. If someone reports a chat, the last 30 messages of that chat are sent to the admin so we can check what happened.</li>
<li>Pictures, photos and videos that a business posts are shown to other people who use the app. Anyone who has the link to a picture, photo or video may also be able to open it.</li> <li>We may share information with the police or a court if the law says we must.</li>
</ul>
<h3>Where it is kept</h3>
<p>Your information is stored with Supabase in a data centre in Ireland (eu-west-1). The app files are hosted by GitHub, and the security check is provided by Cloudflare. These companies handle information for us, and they are outside South Africa. We use providers that have security measures in place.</p>
<h3>How long we keep it</h3>
<p>We keep your information while your account is active. Pictures, photos and videos stay up until the business or we remove them, or until the business account is closed. If you ask us to delete your account, we delete your information, except what we must keep by law or to settle a dispute, such as payment records.</p>
<h3>Keeping it safe</h3>
<p>Logins are protected by passwords, and the database is set up so that people can only see what they are allowed to see. Please keep your password private and never send money or passwords in a chat. No system is perfectly safe. If something goes wrong that could harm you, we will tell you and the Information Regulator.</p>
<h3>Your rights</h3>
<p>You can ask us to show you what we hold about you, to correct it, or to delete it, and you can object to how we use it. If you appear in a photo or video and want it taken down, tell us and we will remove it. Email or phone us. You can also complain to the Information Regulator: enquiries@inforegulator.org.za, 010 023 5200, inforegulator.org.za.</p>
<h3>Information Officer</h3>
<p>Lufefe Melane, smomelane@gmail.com, 081 710 6684.</p>

<h2 style="margin:18px 0 6px">Part 2: Terms of use</h2>
<h3>Using the app</h3>
<p>Inanda Business Web connects customers with local businesses and drivers. We are the platform. Shops sell their own goods, and drivers work for themselves. They do not work for us. Please give true details and keep your password private. You are responsible for what happens on your account.</p>
<h3>Customers</h3>
<p>Orders and trips are paid in cash, at the prices shown in the app. The price for a trip is the price of the driver you choose. Only tap “I have arrived safely” when the trip is really finished. Please do not place or cancel orders and trips just to waste people’s time.</p>
<h3>Shops and other businesses</h3>
<p>Keep your menu, prices and open or paused status correct, and accept or cancel orders honestly. You pay Inanda Business Web the amounts shown in the app by the date shown. If an amount is not paid on time, your shop may be paused until it is paid.</p>
<h3>Opening hours and prices</h3> <p>Keep your trading hours correct. Customers cannot order while your shop is closed. The price a customer pays in the app is worked out by Inanda Business Web from the shop price you set, and you cannot change it yourself.</p> <h3>Pictures, photos and videos</h3> <p>Businesses can post pictures, before-and-after photos and short videos of their menu, specials and work. By uploading a picture, photo or video you agree to these rules:</p> <ul> <li>Only upload photos you took yourself or have the right to use. Do not use pictures from the internet or from other businesses.</li> <li>If a person can be recognised in a photo (for example by a face, a tattoo or another distinctive feature), you must have that person’s clear permission before you upload it. If you do not have permission, crop the photo or choose another one.</li> <li>Do not upload photos that show children (anyone under 18).</li> <li>Before-and-after photos must be real: the same person or job, taken before and after the work, with no editing that changes the result. Basic cropping and brightness are fine. Do not promise results you cannot deliver.</li> <li>Do not upload nudity, violence, or anything offensive or illegal. Do not show private details such as ID documents, house numbers, number plates or phone numbers.</li> <li>You stay the owner of your photos. You give Inanda Business Web permission to show them in the app while your account is active.</li> <li>If a person in a photo asks for it to be taken down, remove it straight away, or tell us and we will remove it.</li> </ul> <p>We may remove any photo, and we may suspend an account that breaks these rules. You are responsible for the photos you upload, including having the right permissions. We do not check every photo before it appears.</p> <h3>Drivers</h3>
<p>You are responsible for your licence, your vehicle, your insurance and any permits you need. We check your details, but we cannot promise that every driver is safe. Pay the fee shown in the app within 7 days of each trip. If a trip stays unpaid for more than 7 days, customers stop seeing you until you pay.</p>
<h3>Payments and fees</h3>
<p>Customers pay shops and drivers directly, in cash. Shops and drivers pay fees to Inanda Business Web by EFT, using the bank details and reference shown in the app. Tell us when you have paid. We confirm it once the money reaches our account.</p>
<h3>Behaviour</h3>
<p>Be respectful. No abuse, threats, scams, spam or illegal goods. Never ask for or send money, passwords or ID numbers in a chat. Orders with shops must be arranged and paid through the app. Do not ask a shop or customer for their cell number or try to make a deal outside the app. Anyone can report a chat with the Report button.</p>
<h3>Suspending accounts</h3>
<p>We can pause or suspend an account, or remove a shop or driver, if these terms are broken, if details are false, if fees are not paid, or to keep people safe. You can ask us to close your account at any time.</p>
<h3>Our responsibility</h3>
<p>We work to keep the app running, but we cannot promise it will always be available or free of errors. We are not responsible for the quality of goods, for how shops or drivers behave, or for loss or injury during a delivery or trip, except where the law says we are. Nothing here takes away the rights you have under South African law, including the Consumer Protection Act.</p>

<p>We may update this policy and these terms. The date at the top shows the latest version, and we will ask you to agree again if the changes are important. These terms are governed by the laws of South Africa.</p>

    if (!bar) { if (rec) cancelRec(true); return; }
    if (!bar.querySelector(".vmic")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn ghost vmic"; b.textContent = "🎤"; b.setAttribute("aria-label", "Record a voice note");
      bar.insertBefore(b, bar.querySelector('[data-a="send"]'));
      const pn = document.createElement("div");
      pn.className = "vpanel";
      pn.innerHTML = '<button type="button" class="btn ghost vbtn vdel" aria-label="Delete recording">🗑</button><button type="button" class="btn ghost vbtn vpause" aria-label="Pause recording">⏸</button><span class="vtime live">● 0:00</span><button type="button" class="btn vbtn vsend" aria-label="Send voice note">Send</button>';
      bar.appendChild(pn);
    }
    paint();
  }

  function cancelRec(quiet) {
    if (!rec) return;
    if (!quiet && secs() > 3 && !confirm("Delete this recording?")) return;
    cancelled = true; sendIt = false;
    if (rec.state !== "inactive") rec.stop();
  }
  function finishRec() {
    if (!rec) return;
    finalSecs = secs(); sendIt = true;
    if (rec.state !== "inactive") rec.stop();
  }
  function togglePause() {
    if (!rec) return;
    if (!paused) { try { rec.pause(); } catch (e) { return; } acc += Date.now() - seg; paused = true; }
    else { try { rec.resume(); } catch (e) { return; } seg = Date.now(); paused = false; }
    paint();
  }
  async function startRec() {
    if (!window.MediaRecorder || !navigator.mediaDevices) { alert("Voice notes do not work in this browser. Please type your message instead."); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { alert("Please allow the microphone to send a voice note."); return; }
    chunks = []; cancelled = false; sendIt = false; paused = false; acc = 0; finalSecs = 0;
    const type = mt(), my = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
    rec = my;
    my.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    my.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(tmr);
      const mime = my.mimeType || type || "audio/webm", doSend = sendIt && !cancelled, n = Math.max(1, finalSecs);
      rec = null; paused = false; paint();
      if (!doSend) return;
      const blob = new Blob(chunks, { type: mime });
      if (blob.size < 1000) { alert("That recording was too short. Please try again."); return; }
      await sendNote(blob, n);
    };
    seg = Date.now(); my.start();
    tmr = setInterval(() => { paint(); if (ms() > 120000) finishRec(); }, 500);
    paint();
  }

  async function sendNote(blob, n) {
    if (!ST.thread) return;
    busy = true; paint();
    const base = (blob.type || "audio/webm").split(";")[0], ext = base.includes("mp4") ? "m4a" : base.includes("ogg") ? "ogg" : "webm";
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(6))).map(x => x.toString(16).padStart(2, "0")).join("");
    const path = sess.user.id + "/" + Date.now() + "-" + rnd + "." + ext;
    try {
      const r = await fetch(SB_URL + "/storage/v1/object/voice-notes/" + path, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + sess.access_token, "Content-Type": base }, body: blob });
      if (!r.ok) {
        let m = ""; try { m = (await r.json()).message || ""; } catch (e) {}
        throw new Error(/bucket not found/i.test(m) ? "Voice notes are not switched on yet. Please tell Inanda Business Web."
          : /row-level security|unauthori[sz]ed/i.test(m) ? "You are not allowed to send voice notes yet. Please tell Inanda Business Web."
          : r.status === 413 ? "That voice note is too big."
          : r.status === 415 || /mime/i.test(m) ? "This phone's voice note format is not supported."
          : "Could not upload the voice note" + (m ? ": " + m : "") + " (code " + r.status + ").");
      }
      try { await rpc("send_message", { p_thread: ST.thread, p_body: "voice:" + path + "|" + n }); }
      catch (e) { fetch(SB_URL + "/storage/v1/object/voice-notes/" + path, { method: "DELETE", headers: { apikey: SB_KEY, Authorization: "Bearer " + sess.access_token } }).catch(() => {}); throw e; }
      await loadThread();
      const l = document.getElementById("chatlog");
      if (l) { l.innerHTML = logHtml(); l.scrollTop = l.scrollHeight; }
      loadChats().then(updateBadges).catch(() => {});
    } catch (e) { ST.err = e.message; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    busy = false; paint();
  }

  document.addEventListener("click", async e => {
    if (e.target.closest(".vmic")) { if (!busy && !rec) startRec(); return; }
    if (e.target.closest(".vdel")) { cancelRec(); return; }
    if (e.target.closest(".vpause")) { togglePause(); return; }
    if (e.target.closest(".vsend")) { finishRec(); return; }
    const bub = e.target.closest(".bub[data-v]"), w = bub && bub.querySelector(".vnote");
    if (w) toggle(w);
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("vnote")) { e.preventDefault(); toggle(e.target); }
  });

  new MutationObserver(() => { decorate(); mic(); }).observe(document.getElementById("app"), { childList: true, subtree: true });
  decorate(); mic();
})();
</script>

<script>
(function () {
  const st = document.createElement("style");
  st.textContent = '@media (min-width:900px){' +
    'main.wide{max-width:1180px;padding:24px 32px 96px}' +
    'main.wide #install .card{max-width:560px}' +
    'main.wide #app{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 20px;align-items:start}' +
    'main.wide #app>h1,main.wide #app>h2,main.wide #app>.sub,main.wide #app>.banner,main.wide #app>.seg,main.wide #app>.note,main.wide #app>.cats,main.wide #app>section,main.wide #app>button.sm{grid-column:1/-1}' +
    'main.wide #app>button.sm{justify-self:start;width:auto}' +
    'main.wide .cats{grid-template-columns:repeat(4,1fr);gap:16px}' +
    'main.wide .cat{min-height:150px}' +
    'main.wide section[aria-label="Inanda news"]{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 16px}' +
    'main.wide section[aria-label="Inanda news"] .sec-h{grid-column:1/-1}' +
    'main.wide .vcard{flex-basis:200px}' +
    /* organised screens: normal flow, two tidy columns, no tab bar */
    'main.wide #app[data-ctx]{display:block}' +
    '.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}' +
    '.cols.one{grid-template-columns:minmax(0,1fr)}' +
    '#app[data-ctx=shop] .cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}' +
    '.col{min-width:0}' +
    '#app[data-ctx=home] .cols{grid-template-columns:minmax(0,1fr)}' +
    '#app[data-ctx=home] .grp{margin-bottom:8px}' +
    '#app[data-ctx=own] .cols,#app[data-ctx=own] .cols.one{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}' +
    '#app[data-ctx=own] .col{display:contents}' +
    '.stabs{display:none!important}' +
    '#app>.grp>button.sm{width:auto}' +
    '}' +
    '@media (max-width:899px){' +
    '.cols,.col{display:contents}' +
    '.grp.off{display:none}' +
    '.stabs{flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}' +
    '.stabs::-webkit-scrollbar{display:none}' +
    '.stabs button{flex:1 0 auto;padding:10px 14px;white-space:nowrap}' +
    '}';
  document.head.appendChild(st);

  function isWide() {
    if (!user) return false;
    if (tab === "cust") return ["home", "food", "build", "beauty"].includes(cview);
    if (tab === "own" || tab === "drv" || tab === "adm") return xtab === "main" && ownView === "due";
    return false;
  }

  // ---- which screens are grouped, and how ----
  const DEF = {
    shop: { tabs: [["order", "Menu"], ["pics", "Pictures"], ["mine", "My orders"]], full: [], c1: ["order", "mine"], c2: ["pics"] },
    home: { tabs: [["svc", "Services"], ["vid", "Advertising"], ["news", "News"]], full: ["svc"], c1: ["vid", "news"], c2: [] },
    own:  { tabs: [["orders", "Orders"], ["money", "Money"], ["menu", "Menu"], ["hours", "Hours"], ["posts", "Posts"], ["videos", "Videos"]], full: [], c1: ["orders", "money", "menu", "hours", "posts", "videos"], c2: [] }
  };
  const OWN_H = { "Incoming orders": "orders", "Your menu prices": "menu", "Manage your menu": "menu", "Trading hours": "hours",
    "Menu and pictures": "posts", "Recent shop posts": "posts", "Show your work": "posts", "Our work": "posts",
    "Promote your business": "videos", "Owner videos": "videos" };
  const sel = {};
  const DESK = window.matchMedia("(min-width:900px)");
  const onSize = () => { if (user) render(); };
  if (DESK.addEventListener) DESK.addEventListener("change", onSize); else if (DESK.addListener) DESK.addListener(onSize);

  function ctxName() {
    if (!user) return null;
    if (tab === "cust") { if (ST.shop && ["food", "build", "beauty"].includes(cview)) return "shop"; if (cview === "home") return "home"; return null; }
    if (tab === "own" && xtab === "main" && ownView === "due" && ST.shop) return "own";
    return null;
  }
  const headText = el => { const h = el.tagName === "H2" ? el : el.querySelector(":scope>h2"); return h ? h.textContent.trim() : ""; };
  function classify(c, el) {
    const t = headText(el), card = el.classList && el.classList.contains("card");
    if (c === "shop") {
      if (el.tagName === "H2" && (t === "Menu and pictures" || t === "Recent work" || t === "Our work")) return "pics";
      if (card && el.querySelector('[data-a="order"]')) return "order";
      if (card && t === "Your orders") return "mine";
    } else if (c === "home") {
      if (el.tagName === "H1") return "svc";
      const l = el.getAttribute && el.getAttribute("aria-label");
      if (l === "Funny videos") return "vid";
      if (l === "Inanda news") return "news";
    } else if (c === "own") {
      if (el.tagName === "H2" && OWN_H[t]) return OWN_H[t];
      if (card && t === "Amount due") return "money";
    }
    return null;
  }

  function organize() {
    const app = document.getElementById("app"); if (!app) return;
    const c = ctxName();
    if (!c) { app.removeAttribute("data-ctx"); return; }
    const def = DEF[c], grps = {}; let cur = null;
    [...app.children].forEach(el => {
      let g = classify(c, el);
      if (!g && el.tagName === "BUTTON") g = c === "home" ? "svc" : cur;
      if (g) cur = g;
      if (!cur) return;
      if (!grps[cur]) { const d = document.createElement("div"); d.className = "grp"; d.dataset.g = cur; grps[cur] = d; }
      grps[cur].appendChild(el);
    });
    const have = def.tabs.filter(t => grps[t[0]]);
    if (!have.length) { app.removeAttribute("data-ctx"); return; }
    app.dataset.ctx = c;
    def.full.forEach(g => { if (grps[g]) app.appendChild(grps[g]); });
    const cols = document.createElement("div"); cols.className = "cols";
    const c1 = document.createElement("div"), c2 = document.createElement("div"); c1.className = c2.className = "col";
    def.c1.forEach(g => { if (grps[g]) c1.appendChild(grps[g]); });
    def.c2.forEach(g => { if (grps[g]) c2.appendChild(grps[g]); });
    if (c1.children.length) cols.appendChild(c1); if (c2.children.length) cols.appendChild(c2);
    if (cols.children.length < 2) cols.classList.add("one");
    if (cols.children.length) app.appendChild(cols);
    if (have.length > 1) {
      const bar = document.createElement("div"); bar.className = "seg stabs"; bar.setAttribute("role", "tablist");
      bar.innerHTML = have.map(([k, l]) => {
        const n = k === "orders" ? grps[k].querySelectorAll('[data-a="accept"],[data-a="deliver"]').length : 0;
        return '<button role="tab" data-a="stab" data-v="' + k + '" data-n="' + l + '">' + l + (n ? " (" + n + ")" : "") + '</button>';
      }).join("");
      const nav = [...app.children].find(x => x.classList && x.classList.contains("seg"));
      if (nav) nav.insertAdjacentElement("afterend", bar); else app.insertBefore(bar, app.firstChild);
      if (!sel[c] || !grps[sel[c]]) sel[c] = c === "shop" && cview === "beauty" && grps.pics ? "pics" : have[0][0];
      applyTabs();
    }
  }
  function applyTabs() {
    const app = document.getElementById("app"), c = app && app.dataset.ctx; if (!c) return;
    app.querySelectorAll(".grp").forEach(g => g.classList.toggle("off", g.dataset.g !== sel[c]));
    app.querySelectorAll(".stabs button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.v === sel[c])));
  }
  H.stab = el => { const app = document.getElementById("app"), c = app && app.dataset.ctx; if (c) { sel[c] = el.dataset.v; applyTabs(); window.scrollTo({ top: 0 }); } return Promise.resolve(); };

  const _render = render;
  render = function () {
    _render();
    const m = document.querySelector("main");
    if (m) m.classList.toggle("wide", isWide());
    try { organize(); } catch (e) {}
  };
})();
</script>

<script>
// ---- push alerts: each person chooses; works with the app closed ----
(function () {
  const VAPID = "BCRhllUIPk7lgblm7h3-eqohJJzvABrk10jh66LKXegBuXLqX638jgpK_QlNaxtSKzwDLG4zgptvR4hDH5-odOM";
  const supported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const getKey = () => { try { return localStorage.getItem("inanda_push") || ""; } catch (e) { return ""; } };
  const setKey = v => { try { localStorage.setItem("inanda_push", v); } catch (e) {} };
  const u8 = b64 => { const s = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
  async function enable() {
    if (!supported()) throw new Error("This phone or browser cannot show alerts while the app is closed. On an iPhone, add the app to your Home Screen first.");
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { setKey("no"); throw new Error("Alerts are blocked. Allow notifications for this app in your phone settings, then try again."); }
    const r = await navigator.serviceWorker.ready; let sub = await r.pushManager.getSubscription();
    if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(VAPID) });
    const j = sub.toJSON();
    await rpc("save_push_sub", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    setKey("on");
  }
  async function disable() {
    try { const r = await navigator.serviceWorker.ready, sub = await r.pushManager.getSubscription();
      if (sub) { try { await rpc("drop_push_sub", { p_endpoint: sub.endpoint }); } catch (e) {} await sub.unsubscribe(); } } catch (e) {}
    setKey("off");
  }
  H.pushon = () => go(async () => { await enable(); ST.note = "Alerts are on. You will hear a sound when something new arrives, even when the app is closed."; });
  H.pushno = () => { setKey("no"); };
  const _snd = H.sndtoggle;
  H.sndtoggle = () => {
    _snd();
    if (!soundOn) { disable(); return; }
    if (supported() && Notification.permission !== "denied") return go(async () => { try { await enable(); } catch (e) {} });
  };
  const _lo = H.logout;
  H.logout = () => {   // a phone that logs out must stop receiving that person's alerts
    const tok = sess && sess.access_token;
    try { if (tok && supported()) navigator.serviceWorker.ready.then(r => r.pushManager.getSubscription()).then(s => { if (s) fetch(SB_URL + "/rest/v1/rpc/drop_push_sub", { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ p_endpoint: s.endpoint }) }).catch(() => {}).then(() => s.unsubscribe()); }).catch(() => {}); } catch (e) {}
    synced = null; return _lo();
  };
  let synced = null;
  const _render = render;
  render = function () {
    _render();
    if (!user || user.tab === "pend" || !supported()) return;
    const app = document.getElementById("app");
    if (getKey() === "" && Notification.permission !== "denied" && app && !app.querySelector(".pushask")) {
      const d = document.createElement("div"); d.className = "card pushask";
      d.innerHTML = '<b>Get alerts with sound</b><p style="margin:6px 0 10px">Hear a sound when you get a message, an order or a trip request, even when the app is closed. You can turn it off any time with the bell at the top.</p><button class="btn" data-a="pushon">Turn on alerts</button><button class="btn ghost" data-a="pushno">Not now</button>';
      const first = app.querySelector(".seg"); if (first) first.insertAdjacentElement("afterend", d); else app.insertBefore(d, app.firstChild);
    }
    const id = sess && sess.user && sess.user.id;
    if (id && synced !== id) { synced = id; if (getKey() === "on" && Notification.permission === "granted") enable().catch(() => {}); }   // keeps this phone linked to whoever is logged in
  };
})();
</script>
