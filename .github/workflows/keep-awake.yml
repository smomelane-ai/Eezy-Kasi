# Calls a tiny database function every day so the free Supabase project is never idle for 7 days.
# The key below is the same PUBLIC key your app already uses in index.html. It is not a secret.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC (07:17 in South Africa)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the database
        env:
          SUPABASE_URL: https://zcqkydqrsriijjwaajjw.supabase.co
          SUPABASE_KEY: sb_publishable_GE52i2wYNandjWq8rjpF4A_kbqIFraT
        run: |
          code=$(curl -sS --max-time 30 -o response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_awake" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: $code"
          echo "Answer: $(cat response.txt)"
          test "$code" = "200"
